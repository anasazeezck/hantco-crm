/* FieldPulse: a quiet, light field workspace. Reference-led rounded geometry.
   Interaction guidance: Emil design engineering. Palette/type guidance: Taste minimalist-ui.
   The supplied reference takes precedence over the latter's sharp-corner defaults. */
:root{color-scheme:light;--bg:#f6f5fa;--surface:#fff;--ink:#111114;--text:#202024;--muted:#6c6a75;--line:#e8e6ed;--teal:#2a7b76;--blue:#111114;--good:#206749;--warn:#875510;--bad:#a2393c;--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);font-family:"Helvetica Neue","Segoe UI",Arial,sans-serif;font-size:14px;font-synthesis:none}
*{box-sizing:border-box}html{scroll-padding-bottom:130px}body{margin:0;background:#eeedf2;color:var(--text);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button,input,select,textarea{min-height:44px}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #577dba;outline-offset:4px}a{color:#236b66;text-decoration:none}p{margin:0 0 12px}h1,h2,h3,h4{line-height:1.22;margin:0;color:var(--ink)}h1{font-size:30px;letter-spacing:-1.15px;font-weight:600}h2{font-size:23px;letter-spacing:-.7px;font-weight:600}h3{font-size:17px;font-weight:600;letter-spacing:-.3px}h4{font-size:15px;font-weight:600}small{color:var(--muted)}svg{width:21px;height:21px;flex-shrink:0;vertical-align:middle}hr,.divider{border:0;border-top:1px solid var(--line);margin:22px 0}button,.btn{overflow-wrap:anywhere}button:active{transform:scale(.97)}button{transition:transform 140ms var(--ease-out)}
.shell{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);position:relative;padding-bottom:calc(120px + env(safe-area-inset-bottom));isolation:isolate}
.app-header{padding:30px 24px 0;display:flex;align-items:center;gap:12px}.brand-mark{background:#111114;color:white;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.brand-mark svg{width:28px;height:28px;stroke-width:2.2}.brand{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:5px}.product{font-size:23px;font-weight:500;letter-spacing:-.7px;line-height:1.2}.notification-btn{margin-left:auto;background:white;color:#111114;min-width:50px;height:50px;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:0 2px 10px #11111403}.notification-btn svg{width:24px;height:24px}.notification-dot{position:absolute;top:11px;right:12px;height:7px;width:7px;border-radius:50%;background:#bc735a;box-shadow:0 0 0 2px white}.notification-dot[hidden]{display:none}.header-meta{padding:17px 24px 0;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted)}.connection{display:inline-flex;gap:6px;align-items:center}.connection:before{content:"";width:5px;height:5px;border-radius:50%;background:#2a7b76}.connection.offline:before{background:#a56c32}
main{padding:26px 24px 10px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:25px}.page-head .eyebrow{font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.1px;text-transform:none;margin-bottom:7px}.eyebrow{text-transform:uppercase;letter-spacing:1.35px;color:#6d6b73;font-size:10px;font-weight:650;margin-bottom:8px}.muted{color:var(--muted);line-height:1.6}.tiny{font-size:12px;line-height:1.6}.section-title{font-size:20px;font-weight:600;letter-spacing:-.55px;margin:27px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title .tiny{font-weight:400;letter-spacing:0}.stack{display:grid;gap:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--surface);border:1px solid #f0eef3;border-radius:26px;padding:21px;min-width:0;box-shadow:0 3px 14px #17122203}.card>.section-title:first-child,.card>div>.section-title:first-child{margin-top:0}.card .section-title{font-size:18px;letter-spacing:-.4px}

function calculateMargin(s,qty,discount,buy,free,incentive){if(!s||![qty,discount,buy,free,incentive].every(Number.isFinite)||!Number.isInteger(qty)||!Number.isInteger(buy)||!Number.isInteger(free)||qty<1||qty>1000000||discount<0||discount>100||buy<1||buy>1000000||free<0||free>1000000||incentive<0||incentive>100000)throw Error('Enter a valid whole pack quantity and bonus offer, 0–100% discount, and a non-negative incentive.');const bonus=Math.floor(qty/buy)*free,units=qty+bonus,cost=qty*s.retailExclVatAED*(1-discount/100),commission=units*incentive,revenue=units*s.retailExclVatAED,profit=revenue-cost-commission;return {bonus,units,cost,commission,revenue,profit,net:cost/units,unitProfit:profit/units,margin:revenue?100*profit/revenue:0,invoice:cost*1.05};}

 if(!d.open)d.showModal();}

/* Guided visits are saved independently until the complete visit commits atomically. */
const W_DRAFT_KEY = 'HANTCO_VISIT_DRAFT_V1';
const W_STEPS = ['Pharmacy', 'Shelf', 'Pitch', 'Online', 'Clinic', 'Finish'];
const W_SPECIALTIES = ['Dermatology', 'GP / Family', 'Pediatrics', 'Gynecology', 'Urology', 'ENT', 'Dental', 'Ophthalmology'];
const W_REQUIREMENTS = [
  {key:'samples', title:'Needs Product Samples'},
  {key:'incentive', title:'Requested Staff Incentive / Commission'},
  {key:'display', title:'Needs Counter Display Stand / Brochure'},
  {key:'account', title:'Direct Account Opening (Trade License / TRN)'}
];
const W_ORDERS = ['Promised Main Store Requisition', 'Promised Order via Drugstore', 'Direct Order Placed with Hantco', 'Follow-Up Required'];
let wDraftWarningShown = false;

function newDraft(account) {
  const source = account ? clone(account) : {};
  const stock = {};
  db.skus.forEach(sku => { stock[sku.id] = {status:'not', qty:'', note:'', nearExpiry:false, talabat:false, ...(source.stock?.[sku.id] || {})}; });
  const first = source.contacts?.[0];
  return {
    id:source.id || uid(), name:source.name || '', emirate:source.emirate || db.master_config.emirates[0], area:source.area || '',
    scenario:source.scenario || 'direct', groupName:source.groupName || '', drugstoreName:source.drugstoreName || '', otherDrugstores:source.otherDrugstores || '',
    gps:source.gps || null, stage:source.stage || db.master_config.pipelineStages[0], stock,
    hasOnline:!!source.hasOnline, hasClinic:!!source.hasClinic, clinicName:source.clinicName || '', doctors:source.doctors || [], contacts:source.contacts || [],
    followUp:source.followUp || '', orderAction:'Follow-Up Required', requests:'', notes:source.notes || '',
    tradeLicense:source.tradeLicense || '', trn:source.trn || '', paymentTerms:source.paymentTerms || '',
    createdAt:source.createdAt || stamp(), updatedAt:source.updatedAt || stamp(), lastVisit:source.lastVisit || null,
    contact:{name:first?.name || '', role:first?.role || 'Pharmacist', phone:first?.phone || ''},
    contactId:first?.id || null, requirements:[], requestLines:{}, visitNotes:'', visitId:uid(), step:1,
    _existing:!!account, _dirty:false, _newGroup:'', _newDrugstore:'', _orderTouched:false, _requestInitialized:false,
    _baseUpdatedAt:source.updatedAt || null
  };
}

function loadVisitDraft() {
  try {
    const raw = localStorage.getItem(W_DRAFT_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' || typeof parsed.id !== 'string' || typeof parsed.visitId !== 'string' || !parsed.stock || typeof parsed.name !== 'string') throw new Error('Invalid draft');
    if (db.timeline_events.some(event => event.visitId === parsed.visitId)) return null;
    if (parsed._existing && !db.accounts.some(a => a.id === parsed.id)) return null;
    const draft = {...newDraft(parsed._existing ? db.accounts.find(a => a.id === parsed.id) : undefined), ...parsed};
    draft.stock = Object.fromEntries(db.skus.map(s => [s.id, {status:'not', qty:'', note:'', nearExpiry:false, talabat:false, ...(parsed.stock[s.id] || {})}]));
    draft.step = Math.max(1, Math.min(6, Number(parsed.step) || 1));
    draft.requirements = Array.isArray(draft.requirements) ? draft.requirements.filter(k => W_REQUIREMENTS.some(r => r.key === k)) : [];
    draft.doctors = Array.isArray(draft.doctors) ? draft.doctors : [];
    draft.contacts = Array.isArray(draft.contacts) ? draft.contacts : [];
    draft.requestLines = draft.requestLines && typeof draft.requestLines === 'object' ? draft.requestLines : {};
    draft.contact = draft.contact && typeof draft.contact === 'object' ? draft.contact : {name:'',role:'Pharmacist',phone:''};
    return draft;
  } catch (error) {
    toast('The saved visit draft could not be read. Your saved accounts are unchanged.');
    return null;
  }
}

function saveDraft() {
  if (!ui.draft) return false;
  ui.draft.step = ui.step;
  try {
    localStorage.setItem(W_DRAFT_KEY, JSON.stringify(ui.draft));
    wDraftWarningShown = false;
    return true;
  } catch (error) {
    if (!wDraftWarningShown) toast('Draft could not be stored on this device. Keep this page open and export a backup.');
    wDraftWarningShown = true;
    return false;
  }
}

function startVisit(accountId) {
  const account = accountId ? db.accounts.find(a => a.id === accountId) : null;
  if (accountId && !account) { toast('This pharmacy is no longer available.'); return false; }
  if (!ui.draft) ui.draft = loadVisitDraft();
  if (ui.draft && ui.draft._dirty && ((account && ui.draft.id !== account.id) || (!account && ui.draft._existing))) {
    if (!confirm('Replace the unfinished visit draft? Saved pharmacy records will remain unchanged.')) return false;
  }
  if (!ui.draft || (account && ui.draft.id !== account.id) || (!account && ui.draft._existing) || !ui.draft._dirty) ui.draft = newDraft(account);
  ui.step = ui.draft.step || 1;
  ui.tab = 'wizard';
  ui.profileId = null;
  closeModal();
  saveDraft();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  return true;
}

function wText(label, key, value, type = 'text', extra = '') {
  return `<label class="field"><span>${esc(label)}</span><input type="${esc(type)}" data-w="${esc(key)}" value="${esc(value ?? '')}" ${extra}></label>`;
}
function wArea(label, key, value, extra = '') {
  return `<label class="field"><span>${esc(label)}</span><textarea rows="3" data-w="${esc(key)}" ${extra}>${esc(value || '')}</textarea></label>`;
}
function wSelect(label, key, value, options) {
  return `<label class="field"><span>${esc(label)}</span><select data-w="${esc(key)}">${options.map(item => {const o = typeof item === 'string' ? {value:item,label:item} : item; return `<option value="${esc(o.value)}" ${String(o.value) === String(value) ? 'selected' : ''}>${esc(o.label)}</option>`;}).join('')}</select></label>`;
}
function wCheck(label, key, value, extra = '') {
  return `<label class="check-row"><input type="checkbox" data-w="${esc(key)}" ${value ? 'checked' : ''} ${extra}><span>${esc(label)}</span></label>`;
}
function wButton(label, action, attrs = '', kind = 'secondary') {
  return `<button type="button" class="btn ${kind}" data-action="${action}" ${attrs}>${label}</button>`;
}
function wEnsureRequests() {
  const d = ui.draft;
  if (!d || d._requestInitialized) return;
  db.skus.forEach(s => { d.requestLines[s.id] = {selected:d.stock[s.id].status !== 'in', qty:1}; });
  d._requestInitialized = true;
  if (!d._orderTouched) d.orderAction = d.scenario === 'group' ? W_ORDERS[0] : d.scenario === 'drugstore' ? W_ORDERS[1] : W_ORDERS[3];
}
function wDoctorMatches(specialty) {
  if (specialty === 'Dermatology' || specialty === 'GP / Family' || specialty === 'GP') return db.skus.filter(s => s.code.startsWith('DA-') || s.code === 'IM-09' || s.code === 'IM-10');
  const codes = {Pediatrics:['IM-03','IM-07'], Gynecology:['IM-02'], Urology:['IM-01'], ENT:['IM-05','IM-06'], Dental:['IM-05'], Ophthalmology:['IM-08']};
  return db.skus.filter(s => (codes[specialty] || []).includes(s.code));
}

function renderWizard() {
  if (!ui.draft) { ui.draft = loadVisitDraft() || newDraft(); ui.step = ui.draft.step || 1; }
  const d = ui.draft;
  const step = Math.max(1, Math.min(6, ui.step || 1));
  const visited = d._existing ? 'RE-VISIT / AUDIT' : 'NEW PHARMACY VISIT';
  const titles = ['Start with the supply route.', 'What is on the shelf?', 'Turn gaps into opportunity.', 'Make the shelf sell online.', 'Map the clinical opportunity.', 'Leave with a clear next step.'];
  const descriptions = ['Capture the pharmacy, then choose how it receives Hantco products.', 'Check all 17 products. Your audit is saved as a draft as you work.', 'Use the live price table and product cards with the pharmacist.', 'Audit only the products physically available in this pharmacy.', 'Connect doctors, duty timings, and the right product categories.', 'Record the order, people, promises, and the next follow-up.'];
  const header = `<div class="row" style="justify-content:space-between"><p class="eyebrow">${visited}</p>${wButton('New draft', 'w-reset', '', 'ghost')}</div>
    <div class="wizard-steps" aria-label="Visit progress">${W_STEPS.map((label,i) => `<button type="button" data-action="w-step" data-step="${i+1}" class="step-pill ${i+1 === step ? 'active' : ''} ${i+1 < step ? 'done' : ''}" aria-current="${i+1 === step ? 'step' : 'false'}" aria-label="Step ${i+1}: ${label}"><span>${i+1}</span><small>${esc(label)}</small></button>`).join('')}</div>
    <div class="section-heading"><p class="eyebrow">STEP ${step} OF 6 ${d.name ? `· ${esc(d.name)}` : ''}</p><h2>${titles[step-1]}</h2><p class="muted">${descriptions[step-1]}</p></div>`;
  const screens = [wRenderRoute, wRenderShelf, wRenderPitch, wRenderOnline, wRenderClinic, wRenderFinish];
  const footer = `<div class="wizard-footer"><span class="tiny muted">${wDraftWarningShown ? 'Draft not stored · keep this page open' : d._dirty ? 'Draft saved on this device' : 'Your visit stays on this device'}</span><div class="row">${step > 1 ? wButton('← Back', 'w-step', `data-step="${step-1}"`) : ''}${step < 6 ? wButton(`Continue · ${step+1} / 6 →`, 'w-step', `data-step="${step+1}"`, 'primary') : ''}</div></div>`;
  return `${header}<div class="stack wizard-content">${screens[step-1]()}</div>${footer}`;
}

function wRenderRoute() {
  const d = ui.draft;
  const scenarios = [
    ['group', 'Group pharmacy', 'Listed in the main branch / central store', 'Main-store transfer'],
    ['drugstore', 'Pharmacy via drugstore', 'Route the order through a listed sub-distributor', 'Partner drugstore'],
    ['direct', 'Direct supply pharmacy', 'No shared drugstore — supply through Hantco', 'Hantco direct']
  ];
  const existing = wSelect('Pharmacy record', 'existing', d._existing ? d.id : '', [{value:'',label:'+ New pharmacy'}, ...db.accounts.map(a => ({value:a.id,label:`${a.name} · ${a.area || a.emirate}`}))]);
  let routeFields = '';
  if (d.scenario === 'group') routeFields = `${wSelect('Listed pharmacy group', 'groupName', d.groupName, [{value:'',label:'Select your group'}, ...db.master_config.listedGroupChains])}
    <div class="inline-add">${wText('New group name', '_newGroup', d._newGroup, 'text', 'maxlength="140"')}${wButton('+ Add New Group', 'w-add-group')}</div>
    <div class="notice">Check which of our 17 SKUs are missing on the shelf and convince the pharmacist to order/requisition them from their main store.</div>`;
  if (d.scenario === 'drugstore') routeFields = `<p class="section-title">Which drugstores do they take supplies from?</p>${wSelect('Listed partner drugstore', 'drugstoreName', d.drugstoreName, [{value:'',label:'Select your drugstore'}, ...db.master_config.listedDrugstores])}
    <div class="inline-add">${wText('New drugstore name', '_newDrugstore', d._newDrugstore, 'text', 'maxlength="140"')}${wButton('+ Add New Drugstore', 'w-add-drugstore')}</div>
    ${wText('Other unlisted drugstores they use', 'otherDrugstores', d.otherDrugstores, 'text', 'maxlength="500"')}
    <div class="notice">Easy Payment &amp; Supply Strategy: Convince them to order our products directly from ${esc(d.drugstoreName || 'their selected partner drugstore')}.</div>`;
  if (d.scenario === 'direct') routeFields = '<div class="notice">Direct Hantco Supply: They don’t use our listed drugstores. Pitch direct supply and collect Trade License / payment details in Step 6.</div>';
  return `<section class="card stack">${existing}${wText('Pharmacy name *', 'name', d.name, 'text', 'required maxlength="160" autocomplete="organization"')}
    <div class="grid2">${wSelect('Emirate', 'emirate', d.emirate, db.master_config.emirates)}${wText('Area / location', 'area', d.area, 'text', 'maxlength="240"')}</div>
    <div class="row">${wButton(icon('pin')+' Pin Current GPS', 'w-gps')}${d.gps ? `<span class="badge good">GPS pinned · ±${Math.round(d.gps.accuracy || 0)} m</span>` : '<span class="tiny muted">Optional location pin</span>'}</div>
    ${d.gps ? `<p class="tiny muted">${Number(d.gps.lat).toFixed(6)}, ${Number(d.gps.lng).toFixed(6)} ${wButton('Remove pin','w-remove-gps','','ghost')}</p>` : ''}</section>

}

function wRenderShelf() {
  const d = ui.draft;
  const counts = {in:0,oos:0,not:0};
  Object.values(d.stock).forEach(s => { if (counts[s.status] !== undefined) counts[s.status]++; });
  return `<div class="row"><span class="badge good">${counts.in} in stock</span><span class="badge warn">${counts.oos} OOS</span><span class="badge bad">${counts.not} not listed</span></div>
    <div class="grid2">${wButton('Mark All In Stock', 'w-bulk', 'data-status="in"')}${wButton('Mark All Zero / Missing', 'w-bulk', 'data-status="not"')}</div>
    ${['Derma Angel Products','Impress Med Products'].map(section => `<section class="stack"><h3 class="section-title">${section} <span class="muted">${db.skus.filter(s => s.section === section).length} SKUs</span></h3>${db.skus.filter(s => s.section === section).map(s => {
      const st = d.stock[s.id];

      <div class="stock-toggle" role="group" aria-label="${esc(s.name)} shelf status">${[['in','Available','In stock','good'],['oos','Out of stock','Reorder','warn'],['not','Not available','Never ordered','bad']].map(([value,label,detail,color]) => `<button type="button" class="${color} ${st.status === value ? 'selected' : ''}" data-action="w-stock" data-sku="${esc(s.id)}" data-status="${value}" aria-pressed="${st.status === value}"><strong>${label}</strong><small>${detail}</small></button>`).join('')}</div>
      <div class="grid2">${wText('Shelf quantity', `stock.${s.id}.qty`, st.qty, 'number', 'min="0" max="999999" step="1" inputmode="numeric"')}${wText('Quick shelf note', `stock.${s.id}.note`, st.note, 'text', 'maxlength="300"')}</div>
      ${wCheck('Near expiry', `stock.${s.id}.nearExpiry`, st.nearExpiry)}</article>`;

}

function wRenderPitch() {
  const d = ui.draft;
  const list = ui.showAll ? db.skus : db.skus.filter(s => d.stock[s.id].status !== 'in');
  return `<div class="notice">${db.skus.filter(s => d.stock[s.id].status !== 'in').length} product opportunities. Tap a product to open its pitch card and pharmacy margin calculator.</div>

function wValidateStepOne() {
  const d = ui.draft;
  if (!d.name.trim()) { toast('Enter a pharmacy name to continue.'); ui.step=1; render(); document.querySelector('[data-w="name"]')?.focus(); return false; }
  if (!db.master_config.emirates.includes(d.emirate)) { toast('Choose an emirate.'); ui.step=1; render(); return false; }
  if (d.scenario === 'group' && !db.master_config.listedGroupChains.includes(d.groupName)) { toast('Select or add the listed pharmacy group.'); ui.step=1; render(); return false; }
  if (d.scenario === 'drugstore' && !db.master_config.listedDrugstores.includes(d.drugstoreName)) { toast('Select or add the partner drugstore.'); ui.step=1; render(); return false; }
  if (!['group','drugstore','direct'].includes(d.scenario)) { toast('Choose a supply scenario.'); ui.step=1; render(); return false; }
  return true;
}

function wNormalizedPhone(value) {
  let number = String(value || '').replace(/[^0-9+]/g,'');
  if (number.startsWith('00')) number = '+' + number.slice(2);
  if (/^05\d{8}$/.test(number)) number = '+971' + number.slice(1);
  if (/^971\d{9}$/.test(number)) number = '+' + number;
  return /^\+[1-9]\d{6,14}$/.test(number) ? number : null;
}

function wSaveVisit(withWhatsApp = false) {
  const d = ui.draft;
  if (!d || !wValidateStepOne()) return false;
  wEnsureRequests();
  if (db.timeline_events.some(event => event.visitId === d.visitId)) { toast('This visit has already been saved.'); return false; }
  const current = db.accounts.find(a => a.id === d.id);
  if (d._existing && !current) { toast('This account was removed. Start a new draft before saving.'); return false; }
  if (current && d._baseUpdatedAt && current.updatedAt !== d._baseUpdatedAt && !confirm('This pharmacy was edited after the visit started. Save this audit and its captured details over the newer account record? Existing timeline entries and promises will be kept.')) return false;
  const duplicate = db.accounts.find(a => a.id !== d.id && a.name.trim().toLocaleLowerCase() === d.name.trim().toLocaleLowerCase() && a.emirate === d.emirate && a.area.trim().toLocaleLowerCase() === d.area.trim().toLocaleLowerCase());
  if (!d._existing && duplicate && !confirm('A pharmacy with this name, emirate, and area already exists. Save a separate account anyway?')) return false;
  const phone = d.contact.phone.trim() ? wNormalizedPhone(d.contact.phone) : '';
  if (d.contact.phone.trim() && !phone) { toast('Enter a valid international mobile number, such as +971 followed by the mobile number.'); ui.step=6; render(); return false; }
  if (withWhatsApp && !phone) { toast('Add the pharmacist’s WhatsApp number before preparing the message.'); ui.step=6; render(); return false; }
  if ((d.contact.phone.trim() || d.contact.name.trim()) && !d.contact.name.trim()) { toast('Add a name for the contact.'); ui.step=6; render(); return false; }
  if (d.hasClinic && d.doctors.some(doctor => !doctor.name.trim())) { toast('Enter a name for each doctor, or remove the empty doctor entry.'); ui.step=5; render(); return false; }
  if (d.trn.trim() && !/^\d{15}$/.test(d.trn.trim())) { toast('A UAE TRN must contain 15 digits. Leave it blank if not collected.'); ui.step=6; render(); return false; }
  for (const sku of db.skus) {
    const row = d.stock[sku.id];
    if (!['in','oos','not'].includes(row.status) || (row.qty !== '' && (!Number.isInteger(Number(row.qty)) || Number(row.qty) < 0 || Number(row.qty) > 999999))) { toast('Shelf quantities must be whole numbers from 0 to 999999.'); ui.step=2; render(); return false; }
    const line = d.requestLines[sku.id];
    if (line?.selected && (!Number.isInteger(Number(line.qty)) || Number(line.qty) < 1 || Number(line.qty) > 999999)) { toast('Requested packs must be whole numbers from 1 to 999999.'); ui.step=6; render(); return false; }
  }
  if (d.followUp && (!/^\d{4}-\d{2}-\d{2}$/.test(d.followUp) || Number.isNaN(Date.parse(d.followUp+'T12:00:00Z')) || new Date(d.followUp+'T12:00:00Z').toISOString().slice(0,10)!==d.followUp)) { toast('Enter a valid follow-up date.'); ui.step=6; render(); return false; }
  const at = stamp();
  const contacts = clone(d.contacts);
  if (d.contact.name.trim()) {
    const contact = {id:d.contactId || uid(), name:d.contact.name.trim(), role:d.contact.role, phone:phone || ''};
    const pos = contacts.findIndex(c => c.id === contact.id);
    if (pos >= 0) contacts[pos] = contact; else contacts.push(contact);
  }
  let stage = d.stage;
  if (stage === db.master_config.pipelineStages[0]) stage = Object.values(d.stock).some(s => s.status === 'in') ? db.master_config.pipelineStages[2] : db.master_config.pipelineStages[1];
  const account = {
    id:d.id, name:d.name.trim(), emirate:d.emirate, area:d.area.trim(), scenario:d.scenario,
    groupName:d.scenario === 'group' ? d.groupName : '', drugstoreName:d.scenario === 'drugstore' ? d.drugstoreName : '', otherDrugstores:d.otherDrugstores.trim(),
    gps:d.gps, stage, stock:clone(d.stock), hasOnline:!!d.hasOnline, hasClinic:!!d.hasClinic,
    clinicName:d.clinicName.trim(), doctors:clone(d.doctors).filter(doc => d.hasClinic || doc.name.trim()).map(doc => ({...doc,name:doc.name.trim(),timings:doc.timings.trim()})), contacts,
    followUp:d.followUp, orderAction:d.orderAction, requests:d.requests.trim(), requestLines:clone(d.requestLines), notes:d.notes,
    tradeLicense:d.tradeLicense.trim(), trn:d.trn.trim(), paymentTerms:d.paymentTerms.trim(),
    createdAt:current?.createdAt || d.createdAt, updatedAt:at, lastVisit:at
  };
  const tasks = [];
  const task = (direction,category,title) => ({id:uid(),accountId:account.id,direction,category,title,dueDate:d.followUp || today(),done:false,createdAt:at,completedAt:null,visitId:d.visitId});
  d.requirements.forEach(key => { const req=W_REQUIREMENTS.find(r=>r.key===key); if(req) tasks.push(task('WE_OWE_THEM',key,req.title)); });
  if (d.hasClinic) d.doctors.filter(doc=>doc.samplesNeeded && !doc.samplesGiven).forEach(doc=>tasks.push(task('WE_OWE_THEM','samples',`Samples for Dr. ${doc.name.trim()} · ${doc.specialty} · ${wDoctorMatches(doc.specialty).map(s=>s.code).join(', ')}`)));
  const requested = db.skus.filter(s=>d.requestLines[s.id]?.selected).map(s=>`${s.code} × ${d.requestLines[s.id].qty}`).join(', ');
  if (d.orderAction !== 'Follow-Up Required') tasks.push(task('THEY_OWE_US','order',`${d.orderAction}${requested ? ': '+requested : ''}${d.requests.trim() ? ' · '+d.requests.trim() : ''}`));
  const countIn = db.skus.filter(s=>d.stock[s.id].status === 'in').length;
  const event = {id:uid(),accountId:account.id,type:'Field Visit',text:`${d.orderAction}. ${countIn}/17 SKUs in stock.${d.visitNotes.trim() ? '\n'+d.visitNotes.trim() : ''}`,createdAt:at,visitId:d.visitId,snapshot:{...clone(account),requirements:clone(d.requirements),visitNotes:d.visitNotes.trim()}};
  const saved = transact(next => {
    const pos=next.accounts.findIndex(a=>a.id===account.id);
    if(pos>=0) next.accounts[pos]=account; else next.accounts.push(account);
    next.timeline_events.push(event);
    next.deliverables.push(...tasks);
  });
  if (!saved) { toast('Visit was not saved. Your draft is still available.'); return false; }
  try { localStorage.removeItem(W_DRAFT_KEY); } catch (error) { /* Saved visit ID prevents duplicate replay. */ }
  ui.draft=null;
  ui.step=1;
  ui.tab='pipeline';
  toast('Visit saved · '+tasks.length+' reminders created.');
  render();
  renderProfile(account.id);
  if (withWhatsApp) openWhatsApp(phone, visitSummary(account));
  return true;
}

function visitSummary(account) {
  const contact=account.contacts?.[0];
  const chosen=db.skus.filter(s=>account.requestLines?.[s.id]?.selected);
  const products=chosen.length ? chosen : db.skus.filter(s=>account.stock?.[s.id]?.status !== 'in');
  const lines=products.map(s=>`• ${s.name}${account.requestLines?.[s.id]?.selected ? ' — '+account.requestLines[s.id].qty+' pack(s)' : ''} — AED ${money(s.retailInclVatAED)} incl. 5% VAT`);
  const route=account.scenario==='group' ? `Please request these from your Main Store / warehouse (${account.groupName}).` : account.scenario==='drugstore' ? `Available to order via ${account.drugstoreName}. Please place your order through your partner drugstore.` : 'Direct supply via Hantco International. Please share Trade License, TRN, and payment terms for account opening.';
  const online=account.hasOnline ? db.skus.filter(s=>account.stock?.[s.id]?.status==='in' && !account.stock[s.id].talabat) : [];
  return [
    '*Hantco International — Visit Summary*',
    `Pharmacy: ${account.name}`,
    `Dear ${contact?.name || 'Pharmacy Team'},`,
    'Thank you for your time. Please find our product follow-up below.',
    '', products.length ? '*Missing / requested products*' : 'All 17 Hantco SKUs are available on your shelf.', ...lines,
    account.requests ? '\nAdditional requirements: '+account.requests : '',
    '', route,
    online.length ? '\n*Physically in stock, missing on Talabat / Instashop*\n'+online.map(s=>'• '+s.name).join('\n')+'\nPlease upload these products to support online sell-through.' : '',
    account.followUp ? '\nNext follow-up: '+account.followUp : '',
    '', 'Hantco International General Trading L.L.C', 'www.hantco.ae | +971-5857 55 666'
  ].filter(line=>line!==undefined).join('\n').replace(/\n{3,}/g,'\n\n');
}

function handleWizardInput(el) {
  const key=el.dataset.w;
  if (!key) return false;
  if (!ui.draft) ui.draft=newDraft();
  const d=ui.draft;
  const value=el.type==='checkbox' ? el.checked : el.value;
  if (key==='existing') {
    if (!value) {
      if(d._dirty && !confirm('Replace this unfinished draft with a new pharmacy visit?')) { render(); return true; }
      ui.draft=newDraft(); ui.step=1; saveDraft(); render();
    } else if (!startVisit(value)) render();
    return true;
  }
  if (key==='showAll') { ui.showAll=!!value; render(); return true; }
  let rerender=false;
  if (key.startsWith('stock.')) {
    const [,skuId,field]=key.split('.');
    if (d.stock[skuId] && ['qty','note','nearExpiry'].includes(field)) d.stock[skuId][field]=value;
  } else if (key.startsWith('doctor.')) {
    const [,id,field]=key.split('.');
    const doctor=d.doctors.find(doc=>doc.id===id);
    if(doctor && ['name','specialty','timings','samplesNeeded','samplesGiven'].includes(field)) { doctor[field]=value; rerender=field==='specialty'; }
  } else if (key.startsWith('contact.')) {
    const field=key.split('.')[1];
    if(['name','role','phone'].includes(field)) d.contact[field]=value;
  } else if (key.startsWith('request.')) {
    const [,id,field]=key.split('.');
    if(skuById(id) && ['selected','qty'].includes(field)) { d.requestLines[id] ||= {selected:false,qty:1}; d.requestLines[id][field]=value; d.requestLines[id]._touched=true; rerender=field==='selected'; }
  } else if (key.startsWith('requirement.')) {
    const req=key.split('.')[1];
    if(W_REQUIREMENTS.some(r=>r.key===req)) d.requirements=value ? [...new Set([...d.requirements,req])] : d.requirements.filter(k=>k!==req);
  } else if (['name','emirate','area','groupName','drugstoreName','otherDrugstores','clinicName','followUp','orderAction','requests','visitNotes','tradeLicense','trn','paymentTerms','_newGroup','_newDrugstore'].includes(key)) {
    d[key]=value;
    if(key==='orderAction') d._orderTouched=true;
    rerender=key==='groupName'||key==='drugstoreName';
  }
  d._dirty=true;
  saveDraft();
  if(rerender) render();
  return true;
}

function handleWizardAction(action, el) {
  if (!action.startsWith('w-')) return false;
  if (!ui.draft) { ui.draft=loadVisitDraft() || newDraft(); ui.step=ui.draft.step; }
  const d=ui.draft;
  let refresh=true;
  switch(action) {
    case 'w-step': {
      const target=Number(el.dataset.step);
      if(!Number.isInteger(target)||target<1||target>6) return true;
      if(target>1 && !wValidateStepOne()) return true;
      ui.step=target;
      if(target===6) wEnsureRequests();
      saveDraft(); render(); window.scrollTo({top:0,behavior:'smooth'}); return true;
    }
    case 'w-reset':
      if(d._dirty && !confirm('Discard this unfinished visit draft and start a new one? Saved CRM records will remain unchanged.')) return true;
      ui.draft=newDraft(); ui.step=1; saveDraft(); render(); window.scrollTo({top:0,behavior:'smooth'}); return true;
    case 'w-route':
      if(!['group','drugstore','direct'].includes(el.dataset.route)) return true;
      d.scenario=el.dataset.route;
      if(!d._orderTouched) d.orderAction=d.scenario==='group'?W_ORDERS[0]:d.scenario==='drugstore'?W_ORDERS[1]:W_ORDERS[3];
      break;
    case 'w-add-group':
    case 'w-add-drugstore': {
      const group=action==='w-add-group';
      const value=(group?d._newGroup:d._newDrugstore).trim();
      if(!value) { toast('Enter a '+(group?'group':'drugstore')+' name first.'); return true; }
      const kind=group?'listedGroupChains':'listedDrugstores';
      const known=db.master_config[kind].find(n=>n.toLocaleLowerCase()===value.toLocaleLowerCase());
      if(!known && !addMaster(kind,value)) return true;
      if(group) {d.groupName=known||value;d._newGroup='';} else {d.drugstoreName=known||value;d._newDrugstore='';}
      toast((group?'Group':'Drugstore')+' selected.'); break;
    }
    case 'w-gps': {
      if(!navigator.geolocation) {toast('This browser does not support location capture.');return true;}
      const visitId=d.visitId;
      el.disabled=true;
      el.textContent='Locating…';
      navigator.geolocation.getCurrentPosition(position=>{
        if(ui.draft?.visitId!==visitId) return;
        ui.draft.gps={lat:position.coords.latitude,lng:position.coords.longitude,accuracy:position.coords.accuracy};
        ui.draft._dirty=true;saveDraft();render();toast('Current GPS location pinned.');
      },error=>{if(ui.draft?.visitId===visitId) render();toast(error.code===1?'Location permission was denied. You can still save the visit.':'Could not get a GPS fix. Try again outdoors.');},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
      return true;
    }
    case 'w-remove-gps':d.gps=null;break;
    case 'w-stock': {
      const id=el.dataset.sku, value=el.dataset.status;
      if(!d.stock[id]||!['in','oos','not'].includes(value)) return true;
      d.stock[id].status=value;
      if(d.requestLines[id]&&!d.requestLines[id]._touched) d.requestLines[id].selected=value!=='in';
      break;
    }
    case 'w-bulk': {
      const value=el.dataset.status;
      if(!['in','not'].includes(value)) return true;
      if(!confirm(value==='in'?'Mark all 17 products as in stock?':'Mark all 17 products as not available / never ordered?')) return true;
      db.skus.forEach(s=>{d.stock[s.id].status=value;if(d.requestLines[s.id]&&!d.requestLines[s.id]._touched)d.requestLines[s.id].selected=value!=='in';});
      break;
    }
    case 'w-online':d.hasOnline=el.dataset.value==='true';break;
    case 'w-talabat':if(d.stock[el.dataset.sku])d.stock[el.dataset.sku].talabat=el.dataset.value==='true';break;
    case 'w-clinic':d.hasClinic=el.dataset.value==='true';break;
    case 'w-add-doctor':d.doctors.push({id:uid(),name:'',specialty:'Dermatology',timings:'',samplesNeeded:false,samplesGiven:false});break;
    case 'w-remove-doctor':
      if(!confirm('Remove this doctor from the visit draft?')) return true;
      d.doctors=d.doctors.filter(doc=>doc.id!==el.dataset.doctor);break;
    case 'w-pitch':openPitch(el.dataset.sku);return true;
    case 'w-save':wSaveVisit(false);return true;
    case 'w-save-whatsapp':wSaveVisit(true);return true;
    default:return false;
  }
  d._dirty=true;
  saveDraft();
  if(refresh) render();
  return true;
}


const settingsState = { sku:null, restore:null, config:null, auth:null, busy:false, email:'', error:'' };
const LIST_LABELS = { listedGroupChains:'Group', listedDrugstores:'Drugstore' };
const MAX_BACKUP_BYTES = 4 * 1024 * 1024;

function validateDatabase(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Backup must contain a database object.');
  const serialized = JSON.stringify(raw);
  if (new Blob([serialized]).size > MAX_BACKUP_BYTES) throw new Error('Database exceeds the 4 MB local storage safety limit. Export and archive older records first.');
  const value = JSON.parse(serialized);
  const walk = (item, depth=0) => {
    if (depth > 20) throw new Error('Backup structure is too deeply nested.');
    if (item && typeof item === 'object') for (const key of Object.keys(item)) {
      if (['__proto__','constructor','prototype'].includes(key)) throw new Error('Backup contains an unsafe property.');
      walk(item[key],depth+1);
    }
    if (typeof item === 'string' && item.length > 30000) throw new Error('A text field exceeds 30,000 characters.');
  };
  walk(value);
  if (value.schemaVersion != null && value.schemaVersion !== 1) throw new Error('Unsupported database version. Expected version 1.');
  value.schemaVersion = 1;
  const requireArray = (item, label, max) => { if (!Array.isArray(item) || item.length > max) throw new Error(`${label} must be an array with at most ${max} records.`); };
  const textValue = (item, label, required=false, max=30000) => {
    if (item == null && !required) return '';
    if (typeof item !== 'string' || item.length > max || (required && !item.trim())) throw new Error(`Invalid ${label}.`);
    return item;
  };
  const ids = (items, label) => {
    const seen = new Set();
    for (const item of items) {
      if (!item || typeof item !== 'object' || Array.isArray(item)) throw new Error(`Invalid ${label} record.`);
      textValue(item.id,`${label} ID`,true,200);
      if (seen.has(item.id)) throw new Error(`Duplicate ${label} ID: ${item.id}`);
      seen.add(item.id);
    }
    return seen;
  };
  const dateValue = (date,label) => {
    if (!date) return '';
    if (typeof date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(Date.parse(date+'T00:00:00Z')) || new Date(date+'T00:00:00Z').toISOString().slice(0,10)!==date) throw new Error(`Invalid ${label} date.`);
    return date;
  };
  const timestamp = (date,label,required=false) => {
    if (date==null || date==='') { if(required)throw new Error(`Missing ${label} timestamp.`); return null; }
    if (typeof date!=='string' || !/^\d{4}-\d{2}-\d{2}T/.test(date) || !Number.isFinite(Date.parse(date))) throw new Error(`Invalid ${label} timestamp.`);
    return new Date(date).toISOString();
  };
  if (!value.company_info || typeof value.company_info!=='object') throw new Error('Company details are missing.');
  for (const key of ['name','address','website','email','phone']) textValue(value.company_info[key],`company ${key}`,true,1000);
  requireArray(value.skus,'Products',17);
  if (value.skus.length!==17) throw new Error('The database must contain all 17 Hantco products.');
  const skuIds = ids(value.skus,'product');
  for (const original of INITIAL_SKUS) if (!skuIds.has(original.id)) throw new Error(`Missing product ${original.id}.`);
  for (const sku of value.skus) {
    for (const key of ['code','section','brand','name']) textValue(sku[key],`product ${key}`,true,500);
    if (sku.code!==sku.id) throw new Error(`Product ID and code do not match for ${sku.id}.`);
    if (sku.section!==INITIAL_SKUS.find(original=>original.id===sku.id).section) throw new Error(`Product section must stay unchanged for ${sku.id}.`);
    for (const key of ['retailExclVatAED','retailInclVatAED','defaultTradeDiscountPct']) {
      if (typeof sku[key]!=='number' || !Number.isFinite(sku[key]) || sku[key]<0 || sku[key]>(key==='defaultTradeDiscountPct'?100:100000)) throw new Error(`Invalid ${key} for ${sku.code}.`);
    }
    requireArray(sku.targetSpecialty,'Product specialties',30);
    sku.targetSpecialty.forEach(x=>textValue(x,'specialty',true,100));
    requireArray(sku.uspBullets,'Product talking points',3);
    if (sku.uspBullets.length!==3) throw new Error(`${sku.code} must have exactly three talking points.`);
    sku.uspBullets.forEach(x=>textValue(x,'talking point',true,2000));
  }
  const config=value.master_config;
  if (!config || typeof config!=='object') throw new Error('Master configuration is missing.');
  for (const key of ['listedGroupChains','listedDrugstores','emirates','pipelineStages']) {
    requireArray(config[key],key,1000);
    const entries=new Set();
    for (const name of config[key]) {
      textValue(name,key,true,200);
      const normalized=name.trim().toLocaleLowerCase();
      if (entries.has(normalized)) throw new Error(`Duplicate entry in ${key}: ${name}`);
      entries.add(normalized);
    }
  }
  if (!config.emirates.length || !config.pipelineStages.length) throw new Error('Emirates and pipeline stages cannot be empty.');
  const requiredStages=seedDatabase().master_config.pipelineStages;
  if (config.pipelineStages.length!==requiredStages.length || config.pipelineStages.some((stage,index)=>stage!==requiredStages[index])) throw new Error('The four original Hantco pipeline stages must remain in their original order.');
  config.supabaseConfig ||= {url:'',anonKey:'',tableName:'hantco_crm_sync',lastSync:null};
  for(const key of ['url','anonKey','tableName']) config.supabaseConfig[key]=textValue(config.supabaseConfig[key],`cloud ${key}`,key==='tableName',4000);
  config.supabaseConfig.lastSync=timestamp(config.supabaseConfig.lastSync,'last sync');
  requireArray(value.accounts,'Accounts',10000);
  const accountIds=ids(value.accounts,'account');
  for (const account of value.accounts) {
    textValue(account.name,'pharmacy name',true,300);
    if (!config.emirates.includes(account.emirate)) throw new Error(`Unknown emirate on ${account.name}.`);
    if (!config.pipelineStages.includes(account.stage)) throw new Error(`Unknown stage on ${account.name}.`);
    if (!['group','drugstore','direct'].includes(account.scenario)) throw new Error(`Invalid supply route on ${account.name}.`);
    if (account.scenario==='group' && !config.listedGroupChains.includes(account.groupName)) throw new Error(`Unknown group on ${account.name}.`);
    if (account.scenario==='drugstore' && !config.listedDrugstores.includes(account.drugstoreName)) throw new Error(`Unknown drugstore on ${account.name}.`);
    for (const key of ['area','groupName','drugstoreName','otherDrugstores','clinicName','orderAction','requests','notes','tradeLicense','trn','paymentTerms']) account[key]=textValue(account[key],`${account.name} ${key}`);
    account.followUp=dateValue(account.followUp,'follow-up');
    for (const key of ['createdAt','updatedAt','lastVisit']) account[key]=timestamp(account[key],key,key!=='lastVisit');
    account.hasOnline=!!account.hasOnline;
    account.hasClinic=!!account.hasClinic;
    if (account.gps!=null) {
      if (typeof account.gps!=='object' || !Number.isFinite(account.gps.lat) || Math.abs(account.gps.lat)>90 || !Number.isFinite(account.gps.lng) || Math.abs(account.gps.lng)>180) throw new Error(`Invalid GPS for ${account.name}.`);
    }
    if (!account.stock || typeof account.stock!=='object' || Array.isArray(account.stock)) throw new Error(`Missing shelf audit on ${account.name}.`);
    for (const sku of value.skus) {
      const stock=account.stock[sku.id];
      if (!stock || !['in','oos','not'].includes(stock.status)) throw new Error(`Invalid shelf status for ${sku.code} on ${account.name}.`);
      stock.note=textValue(stock.note,'shelf note');
      if (stock.qty!=null && !['string','number'].includes(typeof stock.qty)) throw new Error('Invalid stock quantity.');
      stock.qty=stock.qty??'';
      if(stock.qty!=='' && (!Number.isInteger(Number(stock.qty)) || Number(stock.qty)<0 || Number(stock.qty)>999999)) throw new Error(`Invalid stock quantity for ${sku.code} on ${account.name}.`);
      stock.nearExpiry=!!stock.nearExpiry;
      stock.talabat=!!stock.talabat;
    }
    if(account.requestLines!=null) {
      if(typeof account.requestLines!=='object' || Array.isArray(account.requestLines)) throw new Error('Invalid requested SKU lines.');
      for(const [skuId,line] of Object.entries(account.requestLines)) {
        if(!skuIds.has(skuId) || !line || typeof line!=='object')throw new Error('Requested products reference an unknown SKU.');
        line.selected=!!line.selected;
        if(line.selected && (!Number.isInteger(Number(line.qty)) || Number(line.qty)<1 || Number(line.qty)>999999))throw new Error(`Invalid requested quantity for ${skuId}.`);
      }
    }
    account.contacts ||= [];
    account.doctors ||= [];
    requireArray(account.contacts,'Contacts',100);
    requireArray(account.doctors,'Doctors',100);
    ids(account.contacts,'contact');
    ids(account.doctors,'doctor');
    for (const contact of account.contacts) for (const key of ['name','role','phone']) contact[key]=textValue(contact[key],`contact ${key}`,key==='name',500);
    for (const doctor of account.doctors) for (const key of ['name','specialty','timings']) doctor[key]=textValue(doctor[key],`doctor ${key}`,key==='name',1000);
  }
  requireArray(value.timeline_events,'Timeline',50000);
  requireArray(value.deliverables,'Deliverables',50000);
  ids(value.timeline_events,'timeline event');
  ids(value.deliverables,'deliverable');
  for(const event of value.timeline_events) {
    if (!accountIds.has(event.accountId)) throw new Error('Timeline references an unknown account.');
    textValue(event.type,'timeline type',true,200);
    textValue(event.text,'timeline text',true);
    event.createdAt=timestamp(event.createdAt,'timeline',true);
  }
  for(const task of value.deliverables) {
    if (!accountIds.has(task.accountId)) throw new Error('Deliverable references an unknown account.');
    if (!['WE_OWE_THEM','THEY_OWE_US'].includes(task.direction)) throw new Error('Invalid promise direction.');
    textValue(task.title,'deliverable title',true,3000);
    textValue(task.category,'deliverable category',true,100);
    task.dueDate=dateValue(task.dueDate,'deliverable');
    task.done=!!task.done;
    task.createdAt=timestamp(task.createdAt,'deliverable',true);
    task.completedAt=timestamp(task.completedAt,'completion');
  }
  value.revision=Number.isSafeInteger(value.revision)&&value.revision>=0?value.revision:0;
  value.updatedAt=timestamp(value.updatedAt,'database')||new Date().toISOString();
  return value;
}

function addMaster(kind,value) {
  if (!Object.hasOwn(LIST_LABELS,kind)) return false;
  const name=String(value||'').trim();
  if (!name || name.length>200) { toast('Enter a name between 1 and 200 characters.'); return false; }
  if (db.master_config[kind].some(x=>x.toLocaleLowerCase()===name.toLocaleLowerCase())) { toast('This name already exists in your list.'); return false; }
  return transact(next=>{next.master_config[kind].push(name);});
}

function supabaseSQL(table) {
  const name=/^[a-z][a-z0-9_]{0,62}$/.test(table)?table:'hantco_crm_sync';
  return `create table if not exists public.${name} (\n  id uuid primary key references auth.users(id) on delete cascade,\n  payload jsonb not null,\n  updated_at timestamptz not null default now()\n);\nalter table public.${name} enable row level security;\nrevoke all on public.${name} from anon;\ngrant select, insert, update on public.${name} to authenticated;\ndrop policy if exists "Own CRM snapshot" on public.${name};\ncreate policy "Own CRM snapshot" on public.${name}\n  for all to authenticated\n  using ((select auth.uid()) = id)\n  with check ((select auth.uid()) = id);`;
}

function csvCell(value) {
  if (value==null) return '""';
  let text=typeof value==='object'?JSON.stringify(value):String(value);
  if (typeof value!=='number' && /^[\s\uFEFF]*[=+\-@]/.test(text)) text="'"+text;
  if (/^[\t\r\n]/.test(text)) text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}

function makeCSV(rows) { return '\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n'; }

function requestedProductsText(account) {
  return db.skus.filter(sku=>account.requestLines?.[sku.id]?.selected).map(sku=>`${sku.code} | ${sku.name} | ${account.requestLines[sku.id].qty} pack(s)`).join('\n');
}

function backupText(database=db,includeConfig=true) {
  const data=clone(database);
  if (!includeConfig) data.master_config.supabaseConfig={url:'',anonKey:'',tableName:'hantco_crm_sync',lastSync:null};
  return JSON.stringify(data,null,2);

function stageRestore(candidate,source) {
  const validated=validateDatabase(candidate);
  settingsState.restore={database:validated,source,revision:db.revision};
  showDialog('Review database restore',`<div class="stack"><p>Restore from <strong>${esc(source)}</strong>?</p><div class="notice"><strong>${validated.accounts.length} pharmacies · ${validated.skus.length} products</strong><p class="tiny">${validated.timeline_events.length} activities · ${validated.deliverables.length} promises<br>${validated.master_config.listedGroupChains.length} groups · ${validated.master_config.listedDrugstores.length} drugstores</p></div><p>This replaces the current ${db.accounts.length} pharmacies and all local prices, lists and history. Your current database will be kept as a recovery copy. Any open visit draft will be cleared.</p>${button('Download Current Backup First','s-backup')}${button('Replace Local Database','s-restore-confirm','','danger')}${button('Cancel','s-restore-cancel')}</div>`);
}

function finishRestore() {
  const pending=settingsState.restore; if(!pending)return;
  if(db.revision!==pending.revision) {toast('Local data changed. Review the restore again before replacing it.');stageRestore(pending.database,pending.source);return;}
  try {localStorage.setItem('HANTCO_CRM_PRE_RESTORE_V1',backupText());} catch(error) {toast('Could not create a recovery copy. Download a backup and free browser storage first.');return;}
  const nextData=clone(pending.database);
  if(transact(next=>{for(const key of Object.keys(next))delete next[key];Object.assign(next,nextData);})) {
    settingsState.restore=null; settingsState.config=null; settingsState.auth=null; settingsState.sku=null; ui.draft=null; ui.profileId=null;
    try{localStorage.removeItem('HANTCO_VISIT_DRAFT_V1');}catch(error){}
    closeModal();ui.tab='settings';render();toast('Database restored successfully.');
  }
}

function validateCloudConfig(config) {
  let url;
  try {url=new URL(config.url.trim());} catch(error){throw new Error('Enter a valid HTTPS Supabase project URL.');}
  if(url.protocol!=='https:' || url.username || url.password || url.search || url.hash || !['','/'].includes(url.pathname)) throw new Error('Use the HTTPS project origin only, without a path or credentials.');
  const key=config.anonKey.trim();
  if(!key || key.length<20)throw new Error('Enter the project publishable or anonymous API key.');
  if(key.startsWith('sb_secret_'))throw new Error('Secret API keys cannot be stored in this app. Use the publishable key.');
  if(key.split('.').length===3) {
    let claims;
    try{claims=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch(error){throw new Error('The anonymous API key is malformed.');}
    if(claims.role!=='anon')throw new Error('Only an anonymous API key is allowed. Service role or user access tokens must not be used here.');
  } else if(!key.startsWith('sb_publishable_')) throw new Error('Use a Supabase publishable key or legacy anonymous JWT key.');
  if(!/^[a-z][a-z0-9_]{0,62}$/.test(config.tableName.trim()))throw new Error('Table name must use lowercase letters, numbers and underscores, starting with a letter.');
  return {url:url.origin,anonKey:key,tableName:config.tableName.trim(),lastSync:config.lastSync||null};
}

async function cloudFetch(path,options={},config=db.master_config.supabaseConfig) {
  const aborter=new AbortController();const timer=setTimeout(()=>aborter.abort(),20000);
  try {
    const response=await fetch(config.url+path,{...options,headers:{apikey:config.anonKey,'Content-Type':'application/json',...(options.headers||{})},signal:aborter.signal,cache:'no-store',credentials:'omit'});
    const text=await response.text();let result=null;
    try{result=text?JSON.parse(text):null;}catch(error){throw new Error('The cloud endpoint returned an invalid response.');}
    if(!response.ok)throw new Error(result?.msg||result?.message||result?.error_description||`Cloud request failed (${response.status}).`);
    return result;
  } catch(error){if(error.name==='AbortError')throw new Error('Cloud request timed out. Local data is unchanged.');throw error;}finally{clearTimeout(timer);}
}

async function cloudToken() {
  const auth=settingsState.auth;if(!auth)throw new Error('Sign in to Supabase first.');
  if(auth.expiresAt>Date.now()+30000)return auth.token;
  const next=await cloudFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:auth.refresh})});
  if(!next?.access_token || !next.user?.id)throw new Error('Cloud session expired. Sign in again.');
  settingsState.auth={token:next.access_token,refresh:next.refresh_token,userId:next.user.id,email:next.user.email||auth.email,expiresAt:Date.now()+(next.expires_in||3600)*1000};
  return settingsState.auth.token;
}

async function cloudRead(token,config) {
  const userId=settingsState.auth.userId;
  const rows=await cloudFetch(`/rest/v1/${config.tableName}?id=eq.${encodeURIComponent(userId)}&select=id,payload,updated_at`,{headers:{Authorization:`Bearer ${token}`}},config);
  if(!Array.isArray(rows) || rows.length>1)throw new Error('Cloud snapshot response has an unexpected format.');
  return rows[0]||null;
}

async function runCloud(action) {
  if(settingsState.busy)return;
  if(!navigator.onLine){toast('Cloud sync needs an internet connection. Your local data is available.');return;}
  settingsState.busy=true;settingsState.error='';
  try {
    if(action==='login') {
      const config=validateCloudConfig(settingsState.config||db.master_config.supabaseConfig);
      const email=document.getElementById('cloud-email')?.value.trim()||settingsState.email;
      const password=document.getElementById('cloud-password')?.value||'';
      if(!email || !password)throw new Error('Enter your Supabase account email and password.');
      if(!transact(next=>{next.master_config.supabaseConfig=config;}))throw new Error('Cloud configuration could not be saved.');
      settingsState.config=null;settingsState.email=email;
      const passwordEl=document.getElementById('cloud-password');if(passwordEl)passwordEl.value='';
      render();
      const auth=await cloudFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})},config);
      if(!auth?.access_token || !auth.user?.id)throw new Error('Cloud sign-in response is incomplete.');
      settingsState.auth={token:auth.access_token,refresh:auth.refresh_token,userId:auth.user.id,email:auth.user.email||email,expiresAt:Date.now()+(auth.expires_in||3600)*1000};
      toast('Signed in. Choose upload or restore.');
    } else {
      const config=validateCloudConfig(db.master_config.supabaseConfig);
      const token=await cloudToken();const cloud=await cloudRead(token,config);
      if(action==='pull') {
        if(!cloud)throw new Error('There is no cloud snapshot for this user yet. Upload this device first.');
        const candidate=validateDatabase(cloud.payload);
        candidate.master_config.supabaseConfig={...config,lastSync:stamp()};
        stageRestore(candidate,`cloud snapshot from ${new Date(cloud.updated_at).toLocaleString('en-AE',{timeZone:'Asia/Dubai'})} GST`);
      } else if(action==='push') {
        const prompt=cloud?`Replace your cloud snapshot from ${new Date(cloud.updated_at).toLocaleString('en-AE',{timeZone:'Asia/Dubai'})} GST with this device’s ${db.accounts.length} pharmacies?`:`Upload this device’s ${db.accounts.length} pharmacies to your private cloud snapshot?`;
        if(!confirm(prompt))return;
        const data=JSON.parse(backupText(db,false));const now=stamp();const userId=settingsState.auth.userId;
        const query=cloud?`?id=eq.${encodeURIComponent(userId)}&updated_at=eq.${encodeURIComponent(cloud.updated_at)}`:'';
        const body=cloud?{payload:data,updated_at:now}:{id:userId,payload:data,updated_at:now};
        const result=await cloudFetch(`/rest/v1/${config.tableName}${query}`,{method:cloud?'PATCH':'POST',headers:{Authorization:`Bearer ${token}`,Prefer:'return=representation'},body:JSON.stringify(body)},config);
        if(!Array.isArray(result) || result.length!==1)throw new Error('Cloud data changed on another device. Recheck before uploading again.');
        if(transact(next=>{next.master_config.supabaseConfig.lastSync=now;}))toast('Private cloud snapshot uploaded.');
      }
    }
  } catch(error){settingsState.error=error.message||'Cloud sync failed. Local data is unchanged.';toast(settingsState.error);}finally{settingsState.busy=false;if(ui.tab==='settings')render();}
}

function loadDemoAccounts() {
  if(db.accounts.some(a=>a.isDemo)){toast('Demo accounts are already loaded.');return;}
  const when=stamp();
  const result=transact(next=>{
    const names=['Demo Pharmacy A','Demo Pharmacy B','Demo Pharmacy C'];
    names.forEach((name,index)=>{
      const id=uid();const stock=Object.fromEntries(next.skus.map((sku,i)=>[sku.id,{status:i%(index+3)===0?'oos':i%5===0?'not':'in',qty:i%5===0?'':'6',note:'Demo audit',nearExpiry:i===2&&index===0,talabat:i%4!==0}]));
      const account={id,name,isDemo:true,emirate:next.master_config.emirates[index%next.master_config.emirates.length],area:'Demo territory',scenario:'direct',groupName:'',drugstoreName:'',otherDrugstores:'',gps:null,stage:next.master_config.pipelineStages[index%next.master_config.pipelineStages.length],stock,hasOnline:true,hasClinic:index===1,clinicName:index===1?'Demo Clinic':'',doctors:index===1?[{id:uid(),name:'Demo Doctor',specialty:'Pediatrics',timings:'10 AM – 1 PM',samplesNeeded:true,samplesGiven:false}]:[],contacts:[{id:uid(),name:'Demo Pharmacist',role:'Pharmacist',phone:''}],followUp:today(),orderAction:'Follow-Up Required',requests:'Demo follow-up on missing products',notes:'Sample account for testing. Delete when finished.',tradeLicense:'',trn:'',paymentTerms:'',createdAt:when,updatedAt:when,lastVisit:when};
      next.accounts.push(account);
      next.timeline_events.push({id:uid(),accountId:id,type:'Field Visit',text:'Demo visit created for testing.',createdAt:when});
      next.deliverables.push({id:uid(),accountId:id,direction:index===2?'THEY_OWE_US':'WE_OWE_THEM',category:index===2?'order':'samples',title:index===2?'Demo: verify direct order':'Demo: deliver requested samples',dueDate:today(),done:false,createdAt:when,completedAt:null});
    });
  });
  if(result){render();toast('Three clearly labelled demo accounts added.');}
}

async function handleSettingsInput(el) {
  if(el.dataset.settingsSku && settingsState.sku) {settingsState.sku[el.dataset.settingsSku]=el.value===''?NaN:Number(el.value);return true;}
  if(el.dataset.settingsUsp!=null && settingsState.sku) {settingsState.sku.uspBullets[Number(el.dataset.settingsUsp)]=el.value;return true;}
  const key=el.dataset.settings;
  if(!key)return false;
  if(key==='restore-file') {
    const file=el.files?.[0];if(!file)return true;
    try {
      if(file.size>MAX_BACKUP_BYTES)throw new Error('Backup is larger than the 4 MB safety limit.');
      const text=await file.text();const data=JSON.parse(text.replace(/^\uFEFF/,''));stageRestore(data,file.name);
    } catch(error){toast(`Restore rejected: ${error.message}`);}finally{el.value='';}
  } else if(['url','anonKey','tableName'].includes(key)) {
    settingsState.config||=clone(db.master_config.supabaseConfig);settingsState.config[key]=el.value;
  }
  return true;
}

async function handleSettingsAction(action,el) {
  if(!action.startsWith('s-'))return false;
  if(action==='s-list-add') {
    const kind=el.dataset.kind;const inputEl=document.getElementById('new-'+kind);
    if(addMaster(kind,inputEl?.value)){render();toast(`${LIST_LABELS[kind]} added.`);}
  } else if(action==='s-list-rename') {
    const kind=el.dataset.kind,index=Number(el.dataset.index),old=db.master_config[kind]?.[index];if(!old)return true;
    const name=document.getElementById(`${kind}-${index}`)?.value.trim();
    if(!name || name.length>200){toast('Enter a name between 1 and 200 characters.');return true;}
    if(db.master_config[kind].some((x,i)=>i!==index&&x.toLocaleLowerCase()===name.toLocaleLowerCase())){toast('This name already exists.');return true;}
    const fieldName=kind==='listedGroupChains'?'groupName':'drugstoreName';
    if(transact(next=>{next.master_config[kind][index]=name;for(const a of next.accounts)if(a[fieldName]===old){a[fieldName]=name;a.updatedAt=stamp();}})) {
      if(ui.draft?.[fieldName]===old){ui.draft[fieldName]=name;saveDraft();}render();toast('Name updated, including linked pharmacies.');
    }
  } else if(action==='s-list-delete') {
    const kind=el.dataset.kind,index=Number(el.dataset.index),old=db.master_config[kind]?.[index];if(!old)return true;
    const fieldName=kind==='listedGroupChains'?'groupName':'drugstoreName';
    const count=db.accounts.filter(a=>a[fieldName]===old).length;
    if(count || ui.draft?.[fieldName]===old){toast(`This ${LIST_LABELS[kind].toLowerCase()} is used by ${count} account(s) or an open visit. Change their supply routing first.`);return true;}
    if(confirm(`Delete “${old}” from your list?`)&&transact(next=>{next.master_config[kind].splice(index,1);})){render();toast('List entry deleted.');}
  } else if(action==='s-sku-open')openSkuEditor(el.dataset.id);
  else if(action==='s-sku-vat') {
    const sku=settingsState.sku;if(!sku || !Number.isFinite(sku.retailExclVatAED)||sku.retailExclVatAED<0){toast('Enter a valid exclusive price first.');return true;}
    sku.retailInclVatAED=Math.round((sku.retailExclVatAED*1.05+Number.EPSILON)*100)/100;
    document.querySelector('[data-settings-sku="retailInclVatAED"]').value=money(sku.retailInclVatAED);
  } else if(action==='s-sku-save') {
    const sku=settingsState.sku;if(!sku)return true;
    if([sku.retailExclVatAED,sku.retailInclVatAED,sku.defaultTradeDiscountPct].some(x=>!Number.isFinite(x)||x<0)||sku.defaultTradeDiscountPct>100||sku.retailExclVatAED>100000||sku.retailInclVatAED>100000||sku.uspBullets.some(x=>!x.trim())){toast('Enter valid prices, a discount between 0 and 100%, and three talking points.');return true;}
    if(transact(next=>{next.skus[next.skus.findIndex(x=>x.id===sku.id)]=clone(sku);})){settingsState.sku=null;closeModal();render();toast('Product master updated.');}
  } else if(action==='s-csv-accounts')exportAccountsCSV();
  else if(action==='s-csv-history')exportHistoryCSV();
  else if(action==='s-backup')download(`Hantco-Backup-${today()}.json`,backupText(),'application/json');
  else if(action==='s-recovery') {
    const backup=localStorage.getItem('HANTCO_CRM_PRE_RESTORE_V1');if(backup)download(`Hantco-Recovery-${today()}.json`,backup,'application/json');else toast('No previous restore or reset recovery copy is available.');
  } else if(action==='s-restore-confirm')finishRestore();
  else if(action==='s-restore-cancel'){settingsState.restore=null;closeModal();}
  else if(action==='s-demo')loadDemoAccounts();
  else if(action==='s-clear') {
    if(prompt('This resets all accounts, visits, tasks, partner lists and edited prices. Type CLEAR to continue. A recovery copy will be kept.')!=='CLEAR')return true;
    try{localStorage.setItem('HANTCO_CRM_PRE_RESTORE_V1',backupText());}catch(error){toast('A recovery copy could not be saved. Download your backup and free browser storage first.');return true;}
    if(transact(next=>{for(const key of Object.keys(next))delete next[key];Object.assign(next,seedDatabase());})){ui.draft=null;ui.profileId=null;settingsState.config=null;settingsState.auth=null;localStorage.removeItem('HANTCO_VISIT_DRAFT_V1');closeModal();render();toast('Reset complete. Your database is clean.');}
  } else if(action==='s-cloud-config') {
    try{const config=validateCloudConfig(settingsState.config||db.master_config.supabaseConfig);if(transact(next=>{next.master_config.supabaseConfig=config;})){settingsState.config=null;settingsState.auth=null;settingsState.error='';render();toast('Cloud configuration saved. Sign in to sync.');}}catch(error){toast(error.message);}
  } else if(action==='s-cloud-sql') {
    const sql=supabaseSQL((settingsState.config||db.master_config.supabaseConfig).tableName);
    try{await navigator.clipboard.writeText(sql);toast('Setup SQL copied.');}catch(error){showDialog('Supabase setup SQL',`<label class="field"><span>Select and copy this SQL</span><textarea rows="16" readonly>${esc(sql)}</textarea></label>${button('Close','close-modal')}`);}
  } else if(action==='s-cloud-login')await runCloud('login');
  else if(action==='s-cloud-push')await runCloud('push');
  else if(action==='s-cloud-pull')await runCloud('pull');
  else if(action==='s-cloud-logout') {
    const auth=settingsState.auth;settingsState.auth=null;render();toast('Signed out on this device.');
    if(auth)try{await cloudFetch('/auth/v1/logout?scope=local',{method:'POST',headers:{Authorization:`Bearer ${auth.token}`}});}catch(error){}
  }
  return true;
}

async function handleInput(event){
 const el=event.target;if(!(el instanceof HTMLElement))return;
 if(event.type==='input'&&(el.tagName==='SELECT'||['checkbox','radio','file'].includes(el.type)))return;
 if(event.type==='change'&&el.tagName!=='SELECT'&&!['checkbox','radio','file','date'].includes(el.type))return;
 try{
  if(el.dataset.pipeline){ui[el.dataset.pipeline]=el.value;document.getElementById('account-results').innerHTML=accountResults();return;}
  if(el.dataset.calculator){const root=el.closest('[data-calc-root]');if(el.dataset.calculator==='sku')root.querySelector('[data-calculator="discount"]').value=skuById(el.value).defaultTradeDiscountPct;updateCalculator(root);return;}
  if(el.dataset.task){const done=el.checked;const old=db.deliverables.find(t=>t.id===el.dataset.task);if(transact(next=>{const task=next.deliverables.find(t=>t.id===el.dataset.task);task.done=done;task.completedAt=done?stamp():null;next.timeline_events.push(logEvent(task.accountId,done?'Promise Completed':'Promise Reopened',task.title));})){render();refreshProfile();toast(done?'Promise completed.':'Promise reopened.');}else el.checked=old.done;return;}
  if(el.dataset.profile==='stage'){const previous=db.accounts.find(a=>a.id===el.dataset.id).stage,value=el.value;if(transact(next=>{const account=next.accounts.find(a=>a.id===el.dataset.id);account.stage=value;account.updatedAt=stamp();next.timeline_events.push(logEvent(account.id,'Pipeline Updated',value));})){render();toast('Pipeline stage saved.');}else el.value=previous;return;}
  if(handleWizardInput(el))return;
  await handleSettingsInput(el);
 }catch(error){console.error('FieldPulse input failed',error);toast(error.message||'This change could not be saved.');}
}
document.addEventListener('keydown',()=>document.documentElement.classList.add('keyboard-mode'));
document.addEventListener('pointerdown',()=>document.documentElement.classList.remove('keyboard-mode'));
document.addEventListener('click',handleClick);
document.addEventListener('input',handleInput);
document.addEventListener('change',handleInput);
document.addEventListener('submit',e=>e.preventDefault());
document.getElementById('modal-account-360').addEventListener('close',()=>{ui.profileId=null;});
window.addEventListener('online',refreshConnection);window.addEventListener('offline',refreshConnection);
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;document.getElementById('install-banner').hidden=false;});
window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').hidden=true;deferredInstall=null;});
window.addEventListener('storage',event=>{
 if(event.key===DB_KEY&&event.newValue&&event.newValue!==lastStoredRaw){try{db=validateDatabase(JSON.parse(event.newValue));lastStoredRaw=event.newValue;render();refreshProfile();toast('CRM updated from another tab. Your visit draft is preserved.');}catch(error){toast('Another tab saved unreadable data. Export your current backup.');storageBlocked=true;}}
 if(event.key===DB_KEY&&event.newValue===null){storageBlocked=true;toast('CRM storage was cleared in another tab. Reload before making changes.');}
});
window.addEventListener('pagehide',()=>{if(ui.draft)saveDraft();});
let pitchTouch=null;
document.getElementById('modal-pitch').addEventListener('touchstart',e=>{if(!e.target.closest('input,select,textarea,button'))pitchTouch={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};},{passive:true});
document.getElementById('modal-pitch').addEventListener('touchend',e=>{if(!pitchTouch)return;const dx=e.changedTouches[0].clientX-pitchTouch.x,dy=e.changedTouches[0].clientY-pitchTouch.y;pitchTouch=null;if(Math.abs(dx)>85&&Math.abs(dy)<55){const i=db.skus.findIndex(s=>s.id===pitchId);openPitch(db.skus[(i+(dx<0?1:16))%17].id);}},{passive:true});
function boot(){
 try{lastStoredRaw=localStorage.getItem(DB_KEY);if(lastStoredRaw){db=validateDatabase(JSON.parse(lastStoredRaw));}else{db=validateDatabase(seedDatabase());lastStoredRaw=JSON.stringify(db);localStorage.setItem(DB_KEY,lastStoredRaw);}}
 catch(error){storageBlocked=true;document.getElementById('app').innerHTML=`<section id="boot-error"><div class="eyebrow">DATA RECOVERY</div><h1>Your saved records need attention.</h1><p class="muted" style="margin-top:20px">${esc(error.message)}. The original stored data has not been replaced.</p><div class="stack">${button('Download stored data','recover-download','','primary')}${button('Reset after backup','recover-reset','','danger')}</div><p class="tiny muted" style="margin-top:18px">If browser storage is blocked, enable site storage and reload. Keep the downloaded file to recover your records.</p></section>`;return;}
 const requested=new URLSearchParams(location.search).get('view');if(['pipeline','wizard','deliverables','showroom','settings'].includes(requested))ui.tab=requested;
 render();
 if('serviceWorker' in navigator&&isSecureContext&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)toast('An app update is ready. Close all FieldPulse tabs and reopen to apply it.');});});}).catch(()=>toast('Offline shell could not be cached. Reopen online before field use.'));
 if(location.protocol==='file:')toast('For offline installation, serve these three files over HTTPS or localhost.');
}
window.addEventListener('load',()=>{if(window.tailwind)window.tailwind.config={corePlugins:{preflight:false}};});
boot();

</script>
</body>
</html>
